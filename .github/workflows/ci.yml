name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      run_provider_smoke:
        description: Run live provider smoke tests
        required: false
        type: boolean
        default: false

jobs:
  commitlint:
    name: Commit messages
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Lint commit messages
        shell: bash
        run: |
          from="${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}"
          if [ -z "$from" ] || [ "$from" = "0000000000000000000000000000000000000000" ]; then
            from="HEAD~1"
          fi
          npx commitlint --from "$from" --to "${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}"

  test:
    name: Node ${{ matrix.node }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [20, 22, 24]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        if: matrix.os == 'ubuntu-latest' && matrix.node == 24
        run: npm run audit

      - name: Type-check
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Run tests
        run: npm test

      - name: Run coverage gate
        if: matrix.os == 'ubuntu-latest' && matrix.node == 24
        run: npm run coverage

      - name: Run eval regression gate
        run: npm run evals:gate-ci

      - name: Run committed baseline gate
        run: npm run baseline:gate

      - name: Run release checks
        run: npm run release:check

  provider-smoke:
    name: Provider smoke (manual)
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.run_provider_smoke == 'true'
    runs-on: ubuntu-latest
    environment: provider
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Provider smoke
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: npm run provider:ci
